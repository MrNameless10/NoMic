name: Bug report
description: Report a reproducible problem with PrivateMic
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve PrivateMic. Do not include private audio, logs containing personal information, or secrets.
  - type: input
    id: version
    attributes:
      label: PrivateMic version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.6"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Microphone type
      options:
        - Built-in microphone
        - AirPods
        - Bluetooth headset
        - Wired headset
        - USB microphone
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Add non-sensitive screenshots or relevant Console messages if available.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal information, wallet keys, credentials, and private audio from this report.
          required: true

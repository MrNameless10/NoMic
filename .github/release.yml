changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - "dependabot[bot]"
  categories:
    - title: New features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Security and privacy
      labels:
        - security
        - privacy
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"

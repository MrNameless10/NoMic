name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release version
        run: ./Scripts/verify-release-tag.sh "$GITHUB_REF_NAME"

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project PrivateMic.xcodeproj \
            -scheme PrivateMic \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/PrivateMicTestData" \
            test \
            CODE_SIGNING_ALLOWED=NO

      - name: Build verified DMG
        run: ./Scripts/build-release.sh

      - name: Create checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dmg="Dist/PrivateMic-${version}.dmg"
          test -f "$dmg"
          (cd Dist && shasum -a 256 "PrivateMic-${version}.dmg" > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "Dist/PrivateMic-${version}.dmg" \
            "Dist/SHA256SUMS.txt" \
            --generate-notes \
            --latest \
            --title "PrivateMic ${version}" \
            --verify-tag
